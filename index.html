<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โรงเรียนบ้านเทพา - Coming Soon</title>
    <!-- นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d324d 0%, #7f5a83 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .icon-school {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            line-height: 1.4;
        }

        .location-info {
            font-size: 1.1rem;
            font-weight: 300;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .coming-soon-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            color: #ffffff;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-school">🏫</div>
        <h1>เว็บไซต์ โรงเรียนบ้านเทพา</h1>
        
        <div class="location-info">
            ตำบลม่วงสามสิบ อำเภอม่วงสามสิบ<br>
            จังหวัดอุบลราชธานี
        </div>

        <div class="coming-soon-badge">
            COMING SOON
        </div>

        <footer>
            <p>พบกับเว็บไซต์รูปแบบใหม่เร็วๆ นี้</p>
        </footer>
    </div>

</body>
</html>
